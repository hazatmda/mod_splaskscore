name: Release SPLaSK Score Joomla package

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag to package, for example v1.2.3'
        required: true
        type: string

permissions:
  contents: write

env:
  EXTENSION_NAME: mod_splaskscore
  RELEASE_REPOSITORY: hazatmda/mod_splaskscore

jobs:
  release:
    name: Build and publish Joomla release assets
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref }}
          fetch-depth: 0

      - name: Resolve release version
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG_NAME="${{ inputs.release_tag }}"
          else
            TAG_NAME="${GITHUB_REF_NAME}"
          fi

          if ! printf '%s' "$TAG_NAME" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$'; then
            echo "::error title=Invalid release tag::Release tags must look like v1.2.3; got '${TAG_NAME}'."
            exit 1
          fi

          VERSION="${TAG_NAME#v}"
          ZIP_NAME="${EXTENSION_NAME}_v${VERSION}.zip"
          PACKAGE_ZIP_NAME="pkg_splaskscore_v${VERSION}.zip"
          COMPONENT_ZIP_NAME="com_splaskscore_v${VERSION}.zip"
          ZIP_URL="https://github.com/${RELEASE_REPOSITORY}/releases/download/${TAG_NAME}/${ZIP_NAME}"

          {
            echo "release_tag=${TAG_NAME}"
            echo "release_version=${VERSION}"
            echo "zip_name=${ZIP_NAME}"
            echo "package_zip_name=${PACKAGE_ZIP_NAME}"
            echo "component_zip_name=${COMPONENT_ZIP_NAME}"
            echo "expected_zip_url=${ZIP_URL}"
          } >> "$GITHUB_ENV"

          {
            echo "## Release inputs"
            echo "- Tag: ${TAG_NAME}"
            echo "- Version: ${VERSION}"
            echo "- Automatic-update ZIP: ${ZIP_NAME}"
            echo "- User installation package: ${PACKAGE_ZIP_NAME}"
            echo "- Internal component validation ZIP: ${COMPONENT_ZIP_NAME}"
            echo "- Expected download URL: ${ZIP_URL}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Synchronize release metadata from tag
        run: |
          set -euo pipefail

          python3 scripts/sync_release_metadata.py --tag "$release_tag"

          {
            echo "## Synchronized metadata"
            echo "- Manifest version patched to ${release_version}"
            echo "- Update-server version patched to ${release_version}"
            echo "- Update download URL patched to ${expected_zip_url}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Validate Joomla update metadata
        run: |
          set -euo pipefail

          if ! python3 scripts/validate_release_metadata.py --version "$release_version"; then
            echo "::error title=Release metadata validation failed::Expected manifest version, update version, and download URL to match ${release_tag} (${expected_zip_url}). Review the synchronization output above."
            exit 1
          fi

          {
            echo "## Metadata validation"
            echo "- Validation passed for ${release_version}"
            echo "- Validated release ZIP URL: ${expected_zip_url}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Validate PHP syntax
        run: |
          set -euo pipefail

          while IFS= read -r -d '' file; do
            php -l "$file"
          done < <(find . \
            -path './.git' -prune -o \
            -path './.github' -prune -o \
            -path './tests' -prune -o \
            -type f -name '*.php' -print0)

      - name: Run mandatory pre-PR/release simulation
        run: |
          set -euo pipefail

          python3 scripts/pre_pr_validation.py --release-tag "$release_tag"

      - name: Resolve validated package paths
        run: |
          set -euo pipefail

          ZIP_PATH="dist/internal/${zip_name}"
          PACKAGE_ZIP_PATH="dist/release/${package_zip_name}"
          COMPONENT_ZIP_PATH="dist/internal/${component_zip_name}"

          test -f "$ZIP_PATH"
          test -f "$PACKAGE_ZIP_PATH"
          test -f "$COMPONENT_ZIP_PATH"

          echo "zip_path=$ZIP_PATH" >> "$GITHUB_ENV"
          echo "package_zip_path=$PACKAGE_ZIP_PATH" >> "$GITHUB_ENV"
          echo "component_zip_path=$COMPONENT_ZIP_PATH" >> "$GITHUB_ENV"

          {
            echo "## Package"
            echo "- User installation package: ${PACKAGE_ZIP_PATH}"
            echo "- Automatic-update asset: ${ZIP_PATH}"
            echo "- Internal validation asset: ${COMPONENT_ZIP_PATH}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Validate Joomla package contents
        run: |
          set -euo pipefail

          test -f "$zip_path"
          test -f "$package_zip_path"
          test -f "$component_zip_path"
          unzip -l "$zip_path" | tee package-contents.txt
          unzip -p "$zip_path" mod_splaskscore.xml > packaged-manifest.xml
          grep -Eq "<version>${release_version}</version>" packaged-manifest.xml
          grep -Eq '<scriptfile>script\.php</scriptfile>' packaged-manifest.xml
          grep -Eq '<folder>packages</folder>' packaged-manifest.xml
          grep -Eq '^[[:space:]]*[0-9]+[[:space:]]+[0-9\-]+[[:space:]]+[0-9:]+[[:space:]]+mod_splaskscore\.xml$' package-contents.txt
          grep -Eq '^[[:space:]]*[0-9]+[[:space:]]+[0-9\-]+[[:space:]]+[0-9:]+[[:space:]]+script\.php$' package-contents.txt
          grep -Eq '^[[:space:]]*[0-9]+[[:space:]]+[0-9\-]+[[:space:]]+[0-9:]+[[:space:]]+packages/$' package-contents.txt
          grep -Eq '^[[:space:]]*[0-9]+[[:space:]]+[0-9\-]+[[:space:]]+[0-9:]+[[:space:]]+packages/plg_task_splaskscoreanalytics\.zip$' package-contents.txt
          grep -Eq '^[[:space:]]*[0-9]+[[:space:]]+[0-9\-]+[[:space:]]+[0-9:]+[[:space:]]+packages/plg_system_splaskscoreautomation\.zip$' package-contents.txt
          grep -Eq '^[[:space:]]*[0-9]+[[:space:]]+[0-9\-]+[[:space:]]+[0-9:]+[[:space:]]+packages/com_splaskscore\.zip$' package-contents.txt
          unzip -p "$zip_path" script.php > packaged-script.php
          grep -Eq "resolvePackagesPath|/packages" packaged-script.php
          grep -Eq "plg_task_splaskscoreanalytics\.zip" packaged-script.php
          grep -Eq "plg_system_splaskscoreautomation\.zip" packaged-script.php
          grep -Fq '$nestedInstaller = new Installer()' packaged-script.php
          grep -Fq 'DatabaseInterface::class' packaged-script.php
          grep -Fq '$nestedInstaller->install($installPath)' packaged-script.php
          grep -Fq 'ensureSingleModuleInstance' packaged-script.php
          ! grep -Fq 'Installer::getInstance()' packaged-script.php
          unzip -p "$zip_path" packages/plg_task_splaskscoreanalytics.zip > /tmp/plg_task_splaskscoreanalytics.zip
          unzip -p "$zip_path" packages/plg_system_splaskscoreautomation.zip > /tmp/plg_system_splaskscoreautomation.zip
          unzip -p "$zip_path" packages/com_splaskscore.zip > /tmp/com_splaskscore.zip
          unzip -l /tmp/plg_task_splaskscoreanalytics.zip | grep -Eq 'splaskscoreanalytics\.(php|xml)'
          unzip -l /tmp/plg_system_splaskscoreautomation.zip | grep -Eq 'splaskscoreautomation\.(php|xml)'
          unzip -p /tmp/plg_system_splaskscoreautomation.zip splaskscoreautomation.php | grep -Fq 'onContentBeforeSave'
          unzip -p /tmp/plg_system_splaskscoreautomation.zip splaskscoreautomation.php | grep -Fq 'onBeforeCompileHead'
          unzip -l /tmp/com_splaskscore.zip | grep -Eq 'splaskscore\.xml'
          unzip -l /tmp/com_splaskscore.zip | grep -Eq 'administrator/components/com_splaskscore/forms/settings\.xml'
          unzip -l /tmp/com_splaskscore.zip | grep -Eq 'administrator/components/com_splaskscore/src/Model/AnalyticsModel\.php'
          unzip -l /tmp/com_splaskscore.zip | grep -Eq 'administrator/components/com_splaskscore/src/View/Analytics/HtmlView\.php'
          unzip -l /tmp/com_splaskscore.zip | grep -Eq 'administrator/components/com_splaskscore/tmpl/analytics/default\.php'

          if grep -Eq '<folder>sql</folder>' packaged-manifest.xml; then
            grep -Eq '^[[:space:]]*[0-9]+[[:space:]]+[0-9\-]+[[:space:]]+[0-9:]+[[:space:]]+sql/$' package-contents.txt
          fi

          if grep -Eq '<install>[[:space:]]*<sql>|sql/install\.mysql\.utf8\.sql' packaged-manifest.xml; then
            grep -Eq '^[[:space:]]*[0-9]+[[:space:]]+[0-9\-]+[[:space:]]+[0-9:]+[[:space:]]+sql/install\.mysql\.utf8\.sql$' package-contents.txt
            unzip -p "$zip_path" sql/install.mysql.utf8.sql >/dev/null
          fi

          if grep -Eq '<uninstall>[[:space:]]*<sql>|sql/uninstall\.mysql\.utf8\.sql' packaged-manifest.xml; then
            grep -Eq '^[[:space:]]*[0-9]+[[:space:]]+[0-9\-]+[[:space:]]+[0-9:]+[[:space:]]+sql/uninstall\.mysql\.utf8\.sql$' package-contents.txt
            unzip -p "$zip_path" sql/uninstall.mysql.utf8.sql >/dev/null
          fi

          ! grep -Eq '(^|/)(\.git|\.github|tests?)(/|$)' package-contents.txt
          ! grep -Eq '(^|/)(AUDIT_AND_REFACTOR_PLAN\.md|README\.md|updates\.xml|mod_splaskscore_update\.xml|scripts|\.gitignore)(/|$)' package-contents.txt

      - name: Persist release metadata to default branch
        run: |
          set -euo pipefail

          DEFAULT_BRANCH="${{ github.event.repository.default_branch || 'main' }}"
          METADATA_WORKTREE="../${EXTENSION_NAME}-release-metadata"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --no-tags origin "+refs/heads/${DEFAULT_BRANCH}:refs/remotes/origin/${DEFAULT_BRANCH}"
          git worktree remove --force "${METADATA_WORKTREE}" 2>/dev/null || rm -rf "${METADATA_WORKTREE}"
          git worktree add "${METADATA_WORKTREE}" "origin/${DEFAULT_BRANCH}"
          trap 'git worktree remove --force "${METADATA_WORKTREE}" 2>/dev/null || true' EXIT

          python3 scripts/sync_release_metadata.py \
            --tag "${release_tag}" \
            --module-manifest "${METADATA_WORKTREE}/mod_splaskscore.xml" \
            --update-manifest "${METADATA_WORKTREE}/updates.xml" \
            --legacy-update-manifest "${METADATA_WORKTREE}/mod_splaskscore_update.xml" \
            --package-manifest "${METADATA_WORKTREE}/pkg_splaskscore.xml" \
            --plugin-manifest "${METADATA_WORKTREE}/plugins/task/splaskscoreanalytics/splaskscoreanalytics.xml" \
            --system-plugin-manifest "${METADATA_WORKTREE}/plugins/system/splaskscoreautomation/splaskscoreautomation.xml" \
            --component-manifest "${METADATA_WORKTREE}/component/com_splaskscore/splaskscore.xml" \
            --component-asset-manifest "${METADATA_WORKTREE}/component/com_splaskscore/media/com_splaskscore/joomla.asset.json" \
            --helper-file "${METADATA_WORKTREE}/helper.php"

          python3 scripts/validate_release_metadata.py \
            --version "${release_version}" \
            --module-manifest "${METADATA_WORKTREE}/mod_splaskscore.xml" \
            --update-manifest "${METADATA_WORKTREE}/updates.xml" \
            --legacy-update-manifest "${METADATA_WORKTREE}/mod_splaskscore_update.xml" \
            --package-manifest "${METADATA_WORKTREE}/pkg_splaskscore.xml" \
            --plugin-manifest "${METADATA_WORKTREE}/plugins/task/splaskscoreanalytics/splaskscoreanalytics.xml" \
            --system-plugin-manifest "${METADATA_WORKTREE}/plugins/system/splaskscoreautomation/splaskscoreautomation.xml" \
            --component-manifest "${METADATA_WORKTREE}/component/com_splaskscore/splaskscore.xml" \
            --component-asset-manifest "${METADATA_WORKTREE}/component/com_splaskscore/media/com_splaskscore/joomla.asset.json" \
            --helper-file "${METADATA_WORKTREE}/helper.php"

          METADATA_PATHS=(
            mod_splaskscore.xml
            updates.xml
            mod_splaskscore_update.xml
            pkg_splaskscore.xml
            plugins/task/splaskscoreanalytics/splaskscoreanalytics.xml
            plugins/system/splaskscoreautomation/splaskscoreautomation.xml
            component/com_splaskscore/splaskscore.xml
            component/com_splaskscore/media/com_splaskscore/joomla.asset.json
            helper.php
          )

          if git -C "${METADATA_WORKTREE}" diff --quiet -- "${METADATA_PATHS[@]}"; then
            echo "Release metadata on ${DEFAULT_BRANCH} already matches ${release_tag}."
            {
              echo "## Persisted update metadata"
              echo "- ${DEFAULT_BRANCH} already advertises ${release_version}"
              echo "- No commit was required"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          git -C "${METADATA_WORKTREE}" status --short -- "${METADATA_PATHS[@]}"
          git -C "${METADATA_WORKTREE}" add "${METADATA_PATHS[@]}"
          git -C "${METADATA_WORKTREE}" commit -m "Sync release metadata for ${release_tag}"
          git -C "${METADATA_WORKTREE}" push origin "HEAD:${DEFAULT_BRANCH}"

          {
            echo "## Persisted update metadata"
            echo "- Committed manifest and update-server metadata to ${DEFAULT_BRANCH}"
            echo "- Joomla update XML now advertises ${release_version}"
            echo "- Download URL persisted as ${expected_zip_url}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: splaskscore-${{ env.release_version }}
          path: |
            ${{ env.zip_path }}
            ${{ env.package_zip_path }}
            ${{ env.component_zip_path }}
          if-no-files-found: error

      - name: Attach ZIP to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.release_tag }}
          files: |
            ${{ env.package_zip_path }}
            ${{ env.zip_path }}
          fail_on_unmatched_files: true
